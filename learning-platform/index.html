<!DOCTYPE html>
<html>

<head>

<title>TaskFlow</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="sidebar">

<h3>TaskFlow</h3>

<ul>

<li><i class="fa fa-home"></i> Dashboard</li>
<li><i class="fa fa-list"></i> Tasks</li>
<li><i class="fa fa-columns"></i> Kanban</li>
<li><i class="fa fa-chart-pie"></i> Analytics</li>

</ul>

</div>


<div class="main">

<div class="topbar">

<input
type="text"
placeholder="Search tasks">

<div class="user">

<i class="fa fa-user"></i>

</div>

</div>


<div class="container-fluid mt-4">

<div class="row">

<div class="col-md-4">

<div class="card dashboard-card">

<h5>Total Tasks</h5>

<h2 id="totalTasks">0</h2>

</div>

</div>


<div class="col-md-4">

<div class="card dashboard-card">

<h5>Completed</h5>

<h2 id="completedTasks">0</h2>

</div>

</div>


<div class="col-md-4">

<div class="card dashboard-card">

<h5>Pending</h5>

<h2 id="pendingTasks">0</h2>

</div>

</div>

</div>


<div class="card task-card mt-4">

<h4>Create Task</h4>

<div class="row">

<div class="col-md-5">

<input
class="form-control"
id="taskInput"
placeholder="Task name">

</div>

<div class="col-md-3">

<input
type="date"
class="form-control"
id="taskDate">

</div>

<div class="col-md-2">

<select
class="form-control"
id="priority">

<option>Low</option>
<option>Medium</option>
<option>High</option>

</select>

</div>

<div class="col-md-2">

<button
class="btn btn-primary w-100"
onclick="addTask()">

Add

</button>

</div>

</div>

</div>


<div class="row mt-4">

<div class="col-md-4">

<div class="kanban-column" id="todo">

<h5>To Do</h5>

</div>

</div>


<div class="col-md-4">

<div class="kanban-column" id="progress">

<h5>In Progress</h5>

</div>

</div>


<div class="col-md-4">

<div class="kanban-column" id="done">

<h5>Done</h5>

</div>

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
